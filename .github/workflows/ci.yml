name: Spring Boot CI (Gradle Kotlin)

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev"" ]

jobs:
  build:
    runs-on: ubuntu-latest

    # Sets the execution context to the backend subfolder for all run commands
    defaults:
      run:
        working-directory: ./backend

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      # Compiles Kotlin DSL scripts and runs the build/tests
      run: ./gradlew build
